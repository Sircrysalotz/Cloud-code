<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOVA — Pixel Art Preview</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; font-family: monospace; color: #ccc; }
  h1 { margin: 12px 0 4px; font-size: 14px; letter-spacing: 2px; }
  #info { font-size: 11px; margin: 0 0 8px; color: #666; }
  canvas { image-rendering: pixelated; border: 1px solid #333; }
  #controls { display: flex; gap: 16px; margin: 8px; flex-wrap: wrap; justify-content: center; }
  label { font-size: 11px; display: flex; flex-direction: column; gap: 2px; }
  input[type=range] { width: 120px; }
  #ascii { white-space: pre; font-size: 9px; line-height: 1.1; background: #1a1a1a; padding: 8px; margin: 8px; border: 1px solid #333; color: #aaa; }
  button { background: #333; color: #ccc; border: 1px solid #555; padding: 4px 12px; cursor: pointer; font-family: monospace; font-size: 11px; }
  button:hover { background: #444; }
  #status { font-size: 10px; color: #666; margin: 4px; height: 14px; }
</style>
</head>
<body>
<h1>NOVA PIXEL ART PREVIEW</h1>
<p id="info">Three.js cel shader · native low-res render · Roberts Cross outline</p>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="controls">
  <label>Shape
    <select id="shape">
      <option value="sphere">Sphere</option>
      <option value="box">Box (cubist)</option>
      <option value="torus">Torus</option>
      <option value="cone">Cone</option>
    </select>
  </label>
  <label>Sprite size
    <select id="size">
      <option value="32">32×32</option>
      <option value="48">48×48</option>
      <option value="64" selected>64×64</option>
    </select>
  </label>
  <label>Light X <input type="range" id="lx" min="-100" max="100" value="60">
  <label>Light Y <input type="range" id="ly" min="-100" max="100" value="80">
  <label>Light Z <input type="range" id="lz" min="-100" max="100" value="50">
  <label>Specular <input type="range" id="spec" min="0" max="100" value="70">
  <label>Rim <input type="range" id="rim" min="0" max="100" value="50">
  <label>Dither <input type="range" id="dither" min="0" max="100" value="20">
  <label>Depth thresh <input type="range" id="dthresh" min="1" max="50" value="10">
  <button id="btnExport">Export PNG</button>
  <button id="btnAscii">Show ASCII</button>
  <button id="btnRotate">Toggle Rotate</button>
</div>
<div id="ascii"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ── Palette ───────────────────────────────────────────────────────────────────
const PALETTE = [
  { name: 'transparent', r:   0, g:   0, b:   0, a: 0,   ascii: '.' },
  { name: 'outline',     r:  28, g:   8, b:  20, a: 255, ascii: '#' },
  { name: 'shadow_deep', r:  56, g:  12, b:  32, a: 255, ascii: 'X' },
  { name: 'shadow',      r: 104, g:  20, b:  36, a: 255, ascii: 'x' },
  { name: 'mid',         r: 184, g:  40, b:  28, a: 255, ascii: 'o' },
  { name: 'bright',      r: 232, g:  96, b:  36, a: 255, ascii: 'O' },
  { name: 'highlight',   r: 255, g: 168, b:  64, a: 255, ascii: '*' },
  { name: 'peak',        r: 255, g: 224, b: 136, a: 255, ascii: '@' },
];

function hexToVec3(r, g, b) {
  return new THREE.Vector3(r / 255, g / 255, b / 255);
}

const P = (name) => { const c = PALETTE.find(p => p.name === name); return hexToVec3(c.r, c.g, c.b); };

// ── Shaders ───────────────────────────────────────────────────────────────────
const toonVert = `
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  void main() {
    vNormal   = normalize(normalMatrix * normal);
    vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const toonFrag = `
  precision highp float;
  uniform vec3 uLightDir;
  uniform vec3 uViewDir;
  uniform vec3 uColorShadowDeep, uColorShadow, uColorMid, uColorBright, uColorHighlight, uColorPeak;
  uniform float uSpecStrength, uRimStrength, uAOStrength, uDitherAmt;
  varying vec3 vNormal;

  float bayer2(vec2 pos) {
    int ix = int(mod(pos.x, 2.0));
    int iy = int(mod(pos.y, 2.0));
    int idx = ix + iy * 2;
    if (idx == 0) return 0.0;
    if (idx == 1) return 0.5;
    if (idx == 2) return 0.75;
    return 0.25;
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 L = normalize(uLightDir);
    vec3 V = normalize(uViewDir);
    float intensity = max(0.0, dot(N, L));
    vec3 H = normalize(L + V);
    float spec = pow(max(0.0, dot(N, H)), 32.0) * uSpecStrength;
    float specBand = step(0.65, spec);
    float rim = pow(1.0 - max(0.0, dot(N, V)), 2.5);
    float rimBand = step(0.55, rim) * uRimStrength;
    float ao = 1.0 - uAOStrength * smoothstep(0.0, -1.0, N.y) * 0.5;
    float dither = (bayer2(gl_FragCoord.xy) - 0.5) * uDitherAmt * 0.2;
    float final = clamp(max(intensity, max(rimBand, specBand)) * ao + dither, 0.0, 1.0);
    vec3 color;
    if (final < 0.18)       color = uColorShadowDeep;
    else if (final < 0.40)  color = uColorShadow;
    else if (final < 0.62)  color = uColorMid;
    else if (final < 0.84)  color = uColorBright;
    else                    color = uColorHighlight;
    if (specBand > 0.5 && intensity > 0.7) color = uColorPeak;
    gl_FragColor = vec4(color, 1.0);
  }
`;

const outlineVert = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`;

const outlineFrag = `
  precision highp float;
  uniform sampler2D uDepthMap;
  uniform sampler2D uColorMap;
  uniform vec2 uResolution;
  uniform float uDepthThreshold;
  uniform vec3 uOutlineColor;

  void main() {
    vec2 uv = vUv;
    vec2 t = 1.0 / uResolution;
    float d = texture2D(uDepthMap, uv).r;
    if (d >= 0.999) { gl_FragColor = vec4(0.0); return; }
    float dr  = texture2D(uDepthMap, uv + vec2(t.x, 0.0)).r;
    float dd  = texture2D(uDepthMap, uv + vec2(0.0, t.y)).r;
    float ddr = texture2D(uDepthMap, uv + vec2(t.x,  t.y)).r;
    float gx = d - ddr, gy = dr - dd;
    float grad = sqrt(gx*gx + gy*gy);
    bool sil = dr >= 0.999 || dd >= 0.999 || ddr >= 0.999
      || texture2D(uDepthMap, uv + vec2(-t.x, 0.0)).r >= 0.999
      || texture2D(uDepthMap, uv + vec2(0.0, -t.y)).r >= 0.999;
    vec3 base = texture2D(uColorMap, uv).rgb;
    if (sil || grad > uDepthThreshold) gl_FragColor = vec4(uOutlineColor, 1.0);
    else gl_FragColor = vec4(base, 1.0);
  }
`;

// ── Setup ─────────────────────────────────────────────────────────────────────
const status = document.getElementById('status');
let spriteSize = 64;
let rotating = true;
const canvas = document.getElementById('c');

function getUniforms() {
  const lx = parseInt(document.getElementById('lx').value) / 100;
  const ly = parseInt(document.getElementById('ly').value) / 100;
  const lz = parseInt(document.getElementById('lz').value) / 100;
  return {
    uLightDir:        { value: new THREE.Vector3(lx, ly, lz).normalize() },
    uViewDir:         { value: new THREE.Vector3(0, 0, 1) },
    uColorShadowDeep: { value: P('shadow_deep') },
    uColorShadow:     { value: P('shadow') },
    uColorMid:        { value: P('mid') },
    uColorBright:     { value: P('bright') },
    uColorHighlight:  { value: P('highlight') },
    uColorPeak:       { value: P('peak') },
    uSpecStrength:    { value: parseInt(document.getElementById('spec').value) / 100 },
    uRimStrength:     { value: parseInt(document.getElementById('rim').value) / 100 },
    uAOStrength:      { value: 0.4 },
    uDitherAmt:       { value: parseInt(document.getElementById('dither').value) / 100 },
  };
}

function buildScene() {
  spriteSize = parseInt(document.getElementById('size').value);
  const shape = document.getElementById('shape').value;
  const sz = spriteSize;
  const displayScale = Math.floor(512 / sz);

  canvas.width = sz * displayScale;
  canvas.height = sz * displayScale;
  canvas.style.width  = (sz * displayScale) + 'px';
  canvas.style.height = (sz * displayScale) + 'px';

  // ── Renderer at native low resolution (NO anti-aliasing) ───────────────────
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
  renderer.setPixelRatio(1);
  renderer.setSize(sz, sz, false);
  renderer.autoClear = false;

  // ── Scene + camera (orthographic) ─────────────────────────────────────────
  const scene  = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 10);
  camera.position.set(0, 0, 3);
  camera.lookAt(0, 0, 0);

  // ── Geometry ───────────────────────────────────────────────────────────────
  let geo;
  if      (shape === 'sphere') geo = new THREE.SphereGeometry(0.7, 16, 12);
  else if (shape === 'box')    geo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
  else if (shape === 'torus')  geo = new THREE.TorusGeometry(0.5, 0.25, 8, 16);
  else                         geo = new THREE.ConeGeometry(0.6, 1.2, 8);

  // ── Toon material ─────────────────────────────────────────────────────────
  const toonMat = new THREE.ShaderMaterial({
    vertexShader: toonVert,
    fragmentShader: toonFrag,
    uniforms: getUniforms(),
  });
  const mesh = new THREE.Mesh(geo, toonMat);
  scene.add(mesh);

  // ── Depth render target ────────────────────────────────────────────────────
  const depthRT = new THREE.WebGLRenderTarget(sz, sz, {
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
  });
  const colorRT = new THREE.WebGLRenderTarget(sz, sz, {
    format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
  });

  // Depth material
  const depthMat = new THREE.ShaderMaterial({
    vertexShader: `varying float vDepth;
      void main() {
        vec4 pos = modelViewMatrix * vec4(position, 1.0);
        vDepth = -pos.z;
        gl_Position = projectionMatrix * pos;
      }`,
    fragmentShader: `precision highp float;
      varying float vDepth;
      void main() {
        float d = (vDepth - 0.01) / (10.0 - 0.01);
        gl_FragColor = vec4(d, d, d, 1.0);
      }`,
  });

  // ── Outline post-process ──────────────────────────────────────────────────
  const outlineScene  = new THREE.Scene();
  const outlineCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({
      vertexShader:   outlineVert,
      fragmentShader: outlineFrag,
      uniforms: {
        uDepthMap:       { value: depthRT.texture },
        uColorMap:       { value: colorRT.texture },
        uResolution:     { value: new THREE.Vector2(sz, sz) },
        uDepthThreshold: { value: parseInt(document.getElementById('dthresh').value) / 100 },
        uOutlineColor:   { value: P('outline') },
      },
      transparent: true,
    })
  );
  outlineScene.add(quad);

  // ── Display quad (upscale with nearest-neighbor) ──────────────────────────
  const displayRT    = new THREE.WebGLRenderTarget(sz * displayScale, sz * displayScale, {
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
  });
  // We'll render the outline result directly to canvas via a final blit
  // using CSS image-rendering: pixelated

  function updateUniforms() {
    const u = getUniforms();
    for (const [k, v] of Object.entries(u)) {
      if (toonMat.uniforms[k]) toonMat.uniforms[k].value = v.value;
    }
    quad.material.uniforms.uDepthThreshold.value =
      parseInt(document.getElementById('dthresh').value) / 100;
  }

  // ── Render loop ────────────────────────────────────────────────────────────
  let lastTime = 0;
  function render(time) {
    requestAnimationFrame(render);
    if (rotating) mesh.rotation.y = time * 0.001;
    updateUniforms();

    renderer.setSize(sz, sz, false);

    // Pass 1: render depth to depthRT
    mesh.material = depthMat;
    renderer.setRenderTarget(depthRT);
    renderer.clear();
    renderer.render(scene, camera);

    // Pass 2: render toon color to colorRT
    mesh.material = toonMat;
    renderer.setRenderTarget(colorRT);
    renderer.clear();
    renderer.render(scene, camera);

    // Pass 3: outline composite → canvas (upscaled via CSS)
    renderer.setSize(sz, sz, false);
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(outlineScene, outlineCamera);

    // Show canvas at display scale via CSS pixel-snapping
    canvas.style.width  = (sz * displayScale) + 'px';
    canvas.style.height = (sz * displayScale) + 'px';
  }

  renderer.setSize(sz, sz, false);
  requestAnimationFrame(render);
  status.textContent = `Rendering at ${sz}×${sz} native · displayed ${sz * displayScale}×${sz * displayScale}`;

  return { renderer, colorRT, depthRT, sz };
}

let scene = buildScene();

// ── Controls ───────────────────────────────────────────────────────────────
['shape', 'size'].forEach(id => document.getElementById(id).addEventListener('change', () => {
  scene = buildScene();
}));

document.getElementById('btnRotate').addEventListener('click', () => {
  rotating = !rotating;
});

// ── ASCII dump (reads pixel data from canvas after render) ─────────────────
const ASCII_MAP = ['.', '#', 'X', 'x', 'o', 'O', '*', '@'];
function colorToAscii(r, g, b, a) {
  if (a < 128) return '.';
  let bestIdx = 0, bestDist = Infinity;
  for (let i = 0; i < PALETTE.length; i++) {
    const p = PALETTE[i];
    if (p.a === 0) continue;
    const dr = r - p.r, dg = g - p.g, db = b - p.b;
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return PALETTE[bestIdx].ascii;
}

document.getElementById('btnAscii').addEventListener('click', () => {
  const sz = parseInt(document.getElementById('size').value);
  const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
  if (!gl) { document.getElementById('ascii').textContent = '(no WebGL context available)'; return; }
  const pixels = new Uint8Array(sz * sz * 4);
  gl.readPixels(0, 0, sz, sz, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const lines = [];
  for (let row = sz - 1; row >= 0; row--) { // flip Y (WebGL origin is bottom-left)
    let line = '';
    for (let col = 0; col < sz; col++) {
      const i = (row * sz + col) * 4;
      line += colorToAscii(pixels[i], pixels[i+1], pixels[i+2], pixels[i+3]);
    }
    lines.push(line);
  }
  document.getElementById('ascii').textContent = lines.join('\n');
});

// ── PNG Export ────────────────────────────────────────────────────────────────
document.getElementById('btnExport').addEventListener('click', () => {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nova_sprite.png';
    a.click();
  });
});
</script>
</body>
</html>
